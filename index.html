<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookApp</title>
<style>
body { font-family: sans-serif; margin:0; padding:0; background:#ecf0f1; }
header { background:#fff; padding:15px; font-size:24px; color:#2c3e50; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
header span { margin-left:10px; }
#searchBar { display:flex; padding:10px; gap:5px; }
#searchInput { flex:1; padding:8px; font-size:16px; }
button { cursor:pointer; padding:8px; border:none; border-radius:5px; color:#fff; font-weight:bold; }
.menu { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:10px; }
.menu button { background:#e67e22; font-size:14px; }
#bookList { padding:10px; display:flex; flex-direction:column; gap:10px; }
.bookCard { display:flex; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
.bookCard img { width:100px; object-fit:cover; }
.bookInfo { padding:10px; display:flex; flex-direction:column; gap:5px; flex:1; }
.bookInfo .title { font-weight:bold; font-size:16px; color:#2c3e50; }
.bookInfo .author { color:#7f8c8d; }
.bookInfo .price { color:#27ae60; }
#pagination { display:flex; justify-content:center; gap:10px; padding:10px; }
#favoritesBtn { background:#c0392b; font-size:14px; }
#popupOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:1000; }
#popup { background:#fff; padding:20px; border-radius:10px; text-align:center; max-width:300px; width:80%; }
#popup button { margin:5px; background:#3498db; }
#closePopup { background:#e74c3c; }
footer { display:flex; gap:2px; padding:5px; background:#fff; }
footer button { flex:1; background:transparent; color:#34495e; font-size:12px; }
</style>
</head>
<body>

<header>
    📚 <span>BookApp</span>
    <button id="favoritesBtn">❤️ Favoriten</button>
</header>

<div id="searchBar">
<input type="text" id="searchInput" placeholder="Buchtitel, Autor..." />
<button id="searchBtn" style="background:#3498db;">Suchen</button>
</div>

<div class="menu" id="genreMenu"></div>

<div id="bookList"></div>
<div id="pagination"></div>

<!-- Popup für Preisvergleich -->
<div id="popupOverlay">
  <div id="popup">
    <div id="popupTitle" style="margin-bottom:10px;font-weight:bold;"></div>
    <button id="thaliaBtn">Thalia</button>
    <button id="buecherBtn">Bücher.de</button>
    <button id="osianderBtn">Osiander</button>
    <br>
    <button id="closePopup">Schließen</button>
  </div>
</div>

<footer>
<button id="homeBtn">🏠 Home</button>
</footer>

<script>
const API_KEY = "AIzaSyBNQimCLKzMGe2R28r7Q3AHCG9Nzyu4ikI";
let favorites = JSON.parse(localStorage.getItem('favorites')||'[]');
let currentQuery = "";
let currentPage = 1;
const maxPage = 20;
const resultsPerPage = 20;
let currentBookShops = {};

const genres = ["fantasy","thriller","romance","science","history","biography","mystery","horror","children","young adult","nonfiction","comics"];

function parseBooks(data){
    return (data.items||[]).map(item=>{
        const vol = item.volumeInfo || {};
        const sale = item.saleInfo || {};
        const list_price = sale.listPrice || {};
        const price = list_price.amount ? list_price.amount+' '+(list_price.currencyCode||'€') : "Preis nicht verfügbar";
        let isbn="";
        (vol.industryIdentifiers||[]).forEach(id=>{ if(!isbn && ['ISBN_13','ISBN_10'].includes(id.type)) isbn=id.identifier; });
        const encodedTitle = encodeURIComponent(vol.title || "");
        const shops = {
            thalia: `https://www.thalia.de/suche?sq=${encodedTitle}&stype=suchwort`,
            buecher: `https://www.buecher.de/suche?sq=${encodedTitle}&stype=suchwort`,
            osiander: `https://www.osiander.de/suche?sq=${encodedTitle}&stype=suchwort`
        };
        return {
            id:item.id,
            title:vol.title||"Unbekannt",
            author:(vol.authors||["Unbekannt"]).join(", "),
            price:price,
            cover:(vol.imageLinks?.thumbnail||'').replace("http://","https://"),
            isbn:isbn,
            shops: shops
        };
    });
}

async function searchBooks(query, page=1){
    try {
        const startIndex = (page-1)*resultsPerPage;
        const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&langRestrict=de&maxResults=${resultsPerPage}&startIndex=${startIndex}&printType=books&key=${API_KEY}`;
        const res = await fetch(url);
        if(!res.ok) throw new Error("Fehler bei der API-Abfrage");
        const data = await res.json();
        return parseBooks(data);
    } catch(e){
        console.error(e);
        return [];
    }
}

function showBooks(books){
    const container = document.getElementById('bookList');
    container.innerHTML='';
    if(!books.length){
        container.innerHTML='<div>Keine Bücher gefunden oder API-Limit erreicht.</div>';
        document.getElementById('pagination').innerHTML='';
        return;
    }
    books.forEach(book=>{
        const card = document.createElement('div');
        card.className='bookCard';
        card.innerHTML=`
            <img src="${book.cover||'https://via.placeholder.com/100x140?text=📚'}" />
            <div class="bookInfo">
                <div class="title">${book.title}</div>
                <div class="author">von ${book.author}</div>
                <div class="price">${book.price}</div>
                <button class="favBtn">${favorites.some(f=>f.id===book.id)?'✅ In Favoriten':'❤️ Favorisieren'}</button>
                <button class="shopBtn">💰 Preis vergleichen</button>
            </div>
        `;
        card.querySelector('.favBtn').onclick=()=>{ 
            if(!favorites.some(f=>f.id===book.id)) favorites.push(book); 
            localStorage.setItem('favorites', JSON.stringify(favorites));
            card.querySelector('.favBtn').innerText='✅ In Favoriten';
        };
        card.querySelector('.shopBtn').onclick=()=>{ 
            currentBookShops = book.shops;
            document.getElementById('popupTitle').innerText = book.title;
            document.getElementById('popupOverlay').style.display='flex';
        };
        container.appendChild(card);
    });

    // Pagination
    const pagination = document.getElementById('pagination');
    pagination.innerHTML='';
    if(currentPage>1){
        const prev = document.createElement('button');
        prev.innerText='⬅ Zurück';
        prev.onclick=()=>{ currentPage--; searchBooks(currentQuery, currentPage).then(showBooks); };
        pagination.appendChild(prev);
    }
    if(currentPage<maxPage){
        const next = document.createElement('button');
        next.innerText='➡ Weiter';
        next.onclick=()=>{ currentPage++; searchBooks(currentQuery, currentPage).then(showBooks); };
        pagination.appendChild(next);
    }
}

function startSearch(query){
    currentQuery = query;
    currentPage = 1;
    searchBooks(query, currentPage).then(showBooks);
}

// Favorites Button
document.getElementById('favoritesBtn').onclick=()=>{ showBooks(favorites); document.getElementById('pagination').innerHTML=''; };

// Search & Home Buttons
document.getElementById('searchBtn').onclick=()=>{ startSearch(document.getElementById('searchInput').value); };
document.getElementById('homeBtn').onclick=()=>{ document.getElementById('bookList').innerHTML=''; document.getElementById('pagination').innerHTML=''; };

// Popup Buttons
document.getElementById('thaliaBtn').onclick=()=>{ window.open(currentBookShops.thalia, '_blank'); };
document.getElementById('buecherBtn').onclick=()=>{ window.open(currentBookShops.buecher, '_blank'); };
document.getElementById('osianderBtn').onclick=()=>{ window.open(currentBookShops.osiander, '_blank'); };
document.getElementById('closePopup').onclick=()=>{ document.getElementById('popupOverlay').style.display='none'; };

// Genres dynamisch
const genreMenu = document.getElementById('genreMenu');
genres.forEach(g=>{
    const btn = document.createElement('button');
    btn.innerText = g.charAt(0).toUpperCase() + g.slice(1);
    btn.onclick = ()=>{ startSearch("subject:"+g); };
    genreMenu.appendChild(btn);
});
</script>

</body>
</html>
